<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <!-- Navbar brand tile redrawn on a 32px grid with bold shapes so it stays sharp at 16px -->
  <rect x="1" y="1" width="30" height="30" rx="7" fill="#121212" stroke="#e8cf95" stroke-width="2"/>
  <g fill="#e8cf95">
    <!-- Calendar rings -->
    <rect x="10" y="5" width="2.5" height="5" rx="1.25"/>
    <rect x="19.5" y="5" width="2.5" height="5" rx="1.25"/>
    <!-- Calendar header -->
    <path d="M9.5 8h13A2.5 2.5 0 0 1 25 10.5V13H7v-2.5A2.5 2.5 0 0 1 9.5 8z"/>
    <!-- Week days -->
    <rect x="14.5" y="15.5" width="3" height="3" rx=".6"/>
    <rect x="18.5" y="15.5" width="3" height="3" rx=".6"/>
    <rect x="10.5" y="19.5" width="3" height="3" rx=".6"/>
    <rect x="14.5" y="19.5" width="3" height="3" rx=".6"/>
  </g>
  <!-- Calendar body outline -->
  <rect x="8" y="9" width="16" height="15" rx="1.75" fill="none" stroke="#e8cf95" stroke-width="2"/>
</svg>
